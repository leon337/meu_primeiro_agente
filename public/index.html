<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#07111f">
    <meta name="description" content="Hello Agent: seu assistente Gemini na web e no WhatsApp.">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
    <title>Hello Agent</title>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand-mark" aria-hidden="true">H</div>
        <div>
          <h1>Hello Agent</h1>
          <p id="connectionStatus">Verificando conexão…</p>
        </div>
        <button id="settingsButton" class="icon-button" type="button" aria-label="Configurações">⚙</button>
      </header>

      <section id="messages" class="messages" aria-live="polite" aria-label="Conversa">
        <article class="message assistant">
          <div class="bubble">Olá! Sou seu assistente. Como posso ajudar?</div>
        </article>
      </section>

      <form id="chatForm" class="composer">
        <label class="sr-only" for="messageInput">Sua mensagem</label>
        <textarea id="messageInput" rows="1" maxlength="8000" placeholder="Digite sua mensagem…" required></textarea>
        <button id="sendButton" type="submit" aria-label="Enviar mensagem">↑</button>
      </form>
    </main>

    <dialog id="settingsDialog">
      <form method="dialog" class="settings-card">
        <div class="dialog-title">
          <h2>Configurações</h2>
          <button value="cancel" class="icon-button" aria-label="Fechar">×</button>
        </div>
        <label for="accessToken">Token de acesso do aplicativo</label>
        <input id="accessToken" type="password" autocomplete="off" placeholder="APP_ACCESS_TOKEN">
        <p class="hint">O token fica somente neste dispositivo.</p>
        <div class="dialog-actions">
          <button id="newChatButton" type="button" class="secondary">Nova conversa</button>
          <button id="saveSettingsButton" value="default" class="primary">Salvar</button>
        </div>
      </form>
    </dialog>

    <script src="/app.js" defer></script>
  </body>
</html>
