<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#07111f">
    <meta name="description" content="Agente Executivo Pessoal: assistente Gemini com voz e runtime MCF.">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
    <title>Agente Executivo Pessoal</title>
    <style>
      .composer { grid-template-columns: auto 1fr auto; }
      .voice-button { color: #edf6ff !important; background: #16314b !important; }
      .voice-button.listening { background: #d94b64 !important; box-shadow: 0 0 0 .35rem rgba(217,75,100,.18); }
      .toggle-row { display: flex !important; align-items: center; gap: .65rem; margin-top: 1rem; }
      .toggle-row input { width: auto; }
      .stacked-actions { flex-wrap: wrap; }
      .danger { border: 1px solid rgba(255,100,120,.55); color: #ffdce2; background: rgba(217,75,100,.15); }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand-mark" aria-hidden="true">A</div>
        <div>
          <h1>Agente Executivo Pessoal</h1>
          <p id="connectionStatus">Verificando conexão…</p>
        </div>
        <button id="settingsButton" class="icon-button" type="button" aria-label="Configurações">⚙</button>
      </header>

      <section id="messages" class="messages" aria-live="polite" aria-label="Conversa">
        <article class="message assistant">
          <div class="bubble">Olá. Posso conversar, receber comandos por voz e acompanhar missões do MCF.</div>
        </article>
      </section>

      <form id="chatForm" class="composer">
        <button id="micButton" class="voice-button" type="button" aria-label="Falar comando" title="Falar comando">●</button>
        <label class="sr-only" for="messageInput">Sua mensagem</label>
        <textarea id="messageInput" rows="1" maxlength="8000" placeholder="Digite ou fale um comando…" required></textarea>
        <button id="sendButton" type="submit" aria-label="Enviar mensagem">↑</button>
      </form>
    </main>

    <dialog id="settingsDialog">
      <form method="dialog" class="settings-card">
        <div class="dialog-title">
          <h2>Configurações</h2>
          <button value="cancel" class="icon-button" aria-label="Fechar">×</button>
        </div>
        <label for="accessToken">Token de acesso do aplicativo</label>
        <input id="accessToken" type="password" autocomplete="off" placeholder="APP_ACCESS_TOKEN">
        <p class="hint">O token fica somente neste dispositivo.</p>

        <label class="toggle-row" for="voiceOutput">
          <input id="voiceOutput" type="checkbox">
          <span>Ler respostas em voz alta</span>
        </label>

        <label for="missionId">Missão ativa para consulta ou parada</label>
        <input id="missionId" type="text" autocomplete="off" placeholder="MCF-AEP-001">
        <p class="hint">A parada de emergência cancela novas ações, preservando evidências.</p>

        <div class="dialog-actions stacked-actions">
          <button id="newChatButton" type="button" class="secondary">Nova conversa</button>
          <button id="missionStatusButton" type="button" class="secondary">Consultar missão</button>
          <button id="emergencyStopButton" type="button" class="danger">Parada de emergência</button>
          <button id="saveSettingsButton" value="default" class="primary">Salvar</button>
        </div>
      </form>
    </dialog>

    <script src="/app.js" defer></script>
  </body>
</html>
